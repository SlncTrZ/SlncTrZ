name: Generate Snake

on:
  schedule:
    # Refresh several times per day so the profile catches new GitHub contributions faster.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: SlncTrZ
          outputs: |
            snake/github-contribution-grid-snake.svg
            snake/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit refreshed snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake/
          if git diff --cached --quiet; then
            echo "Contribution graph has not changed."
            exit 0
          fi
          git commit -m "chore(profile): refresh contribution snake [skip ci]"
          git push origin HEAD:main
